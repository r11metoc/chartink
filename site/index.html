<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex">
<title>Scanner Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M12 44l12-12 9 9 19-21' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0f766e; --buy: #15803d; --buy-bg: #dcfce7; --hold: #92400e; --hold-bg: #fef3c7;
    --up: #15803d; --down: #b91c1c; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #151b23; --text: #e5e7eb; --muted: #9aa4b2; --line: #263040;
      --accent: #2dd4bf; --buy: #4ade80; --buy-bg: #12301f; --hold: #fbbf24; --hold-bg: #33270d;
      --up: #4ade80; --down: #f87171; --chip: #1e2733;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 18px 16px 8px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  nav { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 16px; display: flex; gap: 6px; max-width: 760px; margin: 0 auto; }
  header { max-width: 760px; margin: 0 auto; }
  nav button {
    flex: 1; border: 0; border-radius: 10px; padding: 9px 0; font: inherit; font-weight: 600;
    background: var(--chip); color: var(--muted); cursor: pointer;
  }
  nav button.on { background: var(--accent); color: #fff; }
  main { padding: 4px 16px 32px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 12px 0; overflow: hidden; }
  .card h2 { font-size: 16px; margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .empty { color: var(--muted); padding: 4px 14px 14px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .sym { font-weight: 650; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chg { font-weight: 650; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 8px; letter-spacing: .02em; }
  .pill.BUY { color: var(--buy); background: var(--buy-bg); }
  .pill.HOLD { color: var(--hold); background: var(--hold-bg); }
  .pill.WAIT { color: var(--muted); background: var(--chip); }
  .pill.SELL { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 14px 10px; font-size: 12.5px; }
  .lv div { background: var(--chip); border-radius: 8px; padding: 5px 8px; }
  .lv span { display: block; color: var(--muted); font-size: 11px; }
  .lv b { font-variant-numeric: tabular-nums; }
  .track { margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 13px; margin-bottom: 6px; }
  .stat div { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .stat div span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .filters button.on { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--up); margin-left: 4px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 14px; border-top: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.tight th, table.tight td { padding: 8px 10px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 16px 24px; }
  .err { color: var(--down); padding: 16px; }
  .note { color: var(--muted); font-size: 12.5px; padding: 0 14px 10px; }
  .srow { grid-template-columns: 1fr auto 64px; }
  .spark rect { fill: var(--muted); opacity: .45; }
  .spark rect.last { fill: var(--accent); opacity: 1; }
  .big { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .tiny { font-size: 11.5px; white-space: nowrap; }
  h3.section { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 2px 4px; }
  .todo .row { grid-template-columns: 1fr auto; }
  .hrow { grid-template-columns: 1fr auto; padding: 9px 14px; }
  .hrow .meta { font-size: 12px; }
  .tag { font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  .tag.up { color: var(--up); background: var(--buy-bg); }
  .tag.down { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .summary div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .summary span { display: block; font-size: 11.5px; color: var(--muted); }
  .summary b { font-size: 17px; font-variant-numeric: tabular-nums; }
  details.card summary { cursor: pointer; padding: 12px 14px; font-weight: 650; list-style: none; display: flex; justify-content: space-between; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "▾"; color: var(--muted); }
  details[open].card summary::after { content: "▴"; }
  .sub2 { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .up-card { padding: 4px 14px 14px; }
  .up-card label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
  .up-card input[type=password], .up-card select, .up-card input[type=file] { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
  .up-card .go { margin-top: 10px; font: inherit; font-weight: 650; padding: 9px 14px; border-radius: 10px; border: 0; background: #0f766e; color: #fff; cursor: pointer; }
  .up-card .go.ghost { background: var(--chip); color: var(--text); }
  .up-msg { font-size: 13px; margin-top: 8px; white-space: pre-line; }
  .up-msg.bad { color: #dc2626; } .up-msg.ok { color: #059669; }
  details.fs summary::-webkit-details-marker { display: none; }
  /* ---- phone app */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
  .refresh { border: 0; background: var(--chip); color: var(--text); border-radius: 999px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; flex: none; }
  .refresh.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #ptr { height: 0; overflow: hidden; text-align: center; color: var(--muted); font-size: 13px; transition: height .15s; }
  .offline { margin: 8px 16px 0; padding: 8px 12px; border-radius: 10px; background: var(--hold-bg); color: var(--hold); font-size: 13px; }
  nav button svg { width: 20px; height: 20px; display: block; margin: 0 auto 2px; }
  .filters button, .sub2 button { min-height: 38px; }
  .tag { white-space: nowrap; display: inline-block; }
  details.about summary { cursor: pointer; color: var(--accent); font-size: 13px; padding: 0 14px 10px; list-style: none; }
  details.about summary::-webkit-details-marker { display: none; }
  @media (max-width: 700px) {
    nav { position: fixed; top: auto; bottom: 0; left: 0; right: 0; padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
          background: var(--card); border-top: 1px solid var(--line); }
    nav button { padding: 6px 0; background: transparent; font-size: 12px; }
    nav button.on { background: transparent; color: var(--accent); }
    main { padding-bottom: 90px; }
    footer { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
    .sub2 { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
    .sub2::-webkit-scrollbar { display: none; }
    .sub2 button { flex: none; white-space: nowrap; }
  }
</style>
</head>
<body>
<header>
  <div><h1>Scanner Tracker</h1>
  <div class="sub" id="updated">Loading…</div></div>
  <button class="refresh" id="refresh" aria-label="Refresh">↻</button>
</header>
<div id="ptr">Release to refresh</div>
<div id="offline"></div>
<nav>
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 4 7-9"/></svg>Today</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>More</button>
</nav>
<main id="view"></main>
<footer>Paper trades from your Chartink scanners. Not advice.</footer>

<script>
const state = { tab: "today", more: "breakouts", fv: "Shortlist", scanner: "All", status: "All", data: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("view") || "{}")); } catch { /* defaults */ }
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => (v == null ? "–" : "₹" + Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pct = (v) => (v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(2) + "%");
const cls = (v) => (v == null || v === 0 ? "" : v > 0 ? "up" : "down");
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
const fmtYear = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { month: "short", year: "numeric" });
const fmtWhen = (iso) => new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }) + " IST";

const rupees = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + "₹" + Math.abs(v).toLocaleString("en-IN");

const lv = (items) => `<div class="lv">${items.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

const STAGE = {
  zone: ["BUY", "BUY ZONE"],
  dip: ["HOLD", "WAIT DIP"],
  breakout: ["BUY", "BUY-STOP"],
};
const CHOICE = { 0: "1st choice", 1: "2nd choice", 2: "3rd choice" };
const SELL = { target: "target", stop: "stop", time: "time limit", average: "below 50-day avg" };
const tags = (x) => (x.confirmed_by && x.confirmed_by.length ? ` · <b class="up">⭐ also on ${x.confirmed_by.map(esc).join(", ")}</b>` : "")
  + (x.off_high != null ? ` · ${Math.abs(x.off_high).toFixed(0)}% off 52w high` : "");

function equityChart(m) {
  const pts = m.filter((x) => x.v != null);
  if (pts.length < 2) return "";
  const vals = pts.flatMap((x) => [x.v, x.b]).filter((v) => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), W = 600, H = 150, pad = 4;
  const X = (i) => pad + (i * (W - 2 * pad)) / (pts.length - 1);
  const Y = (v) => H - pad - ((v - lo) / (hi - lo || 1)) * (H - 2 * pad);
  const line = (key) => pts.map((x, i) => (x[key] == null ? "" : `${X(i).toFixed(1)},${Y(x[key]).toFixed(1)}`)).filter(Boolean).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;padding:0 14px 4px" role="img" aria-label="Portfolio value against the Nifty 500">
    <polyline points="${line("b")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
    <polyline points="${line("v")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>
    <div class="note"><span style="color:var(--accent)">━</span> alerts portfolio &nbsp; <span>┅</span> Nifty 500 · ${esc(pts[0].m)} to ${esc(pts[pts.length - 1].m)}</div>`;
}

function renderPerformance(f) {
  if (!f) return "";
  const p = f.portfolio, b = f.bench;
  const L = (v) => "₹" + (v / 100000).toFixed(1) + "L";
  const sc = f.per_scanner.map((r) => `<tr><td>${esc(r.group)}</td><td class="n">${r.trades}</td><td class="n">${r.win}%</td>
    <td class="n ${cls(r.avg)}">${pct(r.avg)}</td><td class="n">${r.days}d</td></tr>`).join("");
  const yrs = f.years.map((y) => `<tr><td>${y.year}</td><td class="n ${cls(y.ret)}">${y.ret > 0 ? "+" : ""}${y.ret}%</td>
    <td class="n ${cls(y.bench)}">${y.bench == null ? "–" : (y.bench > 0 ? "+" : "") + y.bench + "%"}</td></tr>`).join("");
  return `<section class="card"><h2>📈 If you had bought on the alerts <small>backtest since ${fmtYear(f.start)}</small></h2>
    <div class="note">Starting with ₹${p.capital / 100000}L, each buy is 1/${p.max_pos} of the portfolio's value at the time (profits reinvested),
      at most ${p.max_pos} open, first come first served, after costs.</div>
    <div class="lv"><div><span>₹${p.capital / 100000}L became</span><b>${L(p.final)}</b></div>
      <div><span>Per year</span><b class="${cls(p.cagr)}">${p.cagr}%</b></div>
      <div><span>Worst fall</span><b class="down">${p.max_dd}%</b></div></div>
    ${b ? `<div class="lv"><div><span>Nifty 500 instead</span><b>${L(b.final)}</b></div>
      <div><span>Per year</span><b class="${cls(b.cagr)}">${b.cagr}%</b></div>
      <div><span>Worst fall</span><b class="down">${b.max_dd}%</b></div></div>` : ""}
    ${equityChart(f.monthly)}
    <table class="tight"><tr><th>Every alert</th><th class="n">Trades</th><th class="n">Won</th><th class="n">Avg</th><th class="n">Held</th></tr>${sc}</table>
    <table class="tight"><tr><th>Year</th><th class="n">Alerts</th><th class="n">Nifty 500</th></tr>${yrs}</table>
    ${(f.exits || []).length ? `<h2 style="padding-top:14px">Exit rules compared <small>same dip buys</small></h2>
      <table class="tight"><tr><th>Sell when</th><th class="n">Won</th><th class="n">Avg</th><th class="n">Held</th><th class="n">Per year</th><th class="n">Worst</th></tr>
      ${f.exits.map((x) => `<tr><td>${esc(x.label)}</td><td class="n">${x.win}%</td><td class="n ${cls(x.avg)}">${pct(x.avg)}</td>
        <td class="n">${x.days}d</td><td class="n ${cls(x.cagr)}">${x.cagr}%</td><td class="n down">${x.max_dd}%</td></tr>`).join("")}</table>
      <div class="note" style="padding-top:6px">All keep the starting 12% stop (15% Wkly_upswing); riding exits sell after a year at the latest.</div>` : ""}
    <div class="note" style="padding-top:8px">${p.taken} trades taken, ${p.skipped} skipped for want of a free slot (${p.win}% of those taken won).
      Open positions counted at cost; this year is year-to-date. Past results, not a promise.</div></section>`;
}

function renderBreakouts(d) {
  const names = ["All", ...new Set(d.breakouts.map((b) => b.scanner))];
  const rows = d.breakouts.filter((b) =>
    (state.scanner === "All" || b.scanner === state.scanner) && (state.status === "All" || b.status === state.status));
  const stats = d.stats.map((s) => `
    <div class="stat"><b>${esc(s.scanner)}</b>
      <div><span>Triggers</span><span>${s.count}</span></div>
      <div><span>Above trigger</span><span>${s.above} (${Math.round((s.above / s.count) * 100)}%)</span></div>
      <div><span>Avg move</span><span class="${cls(s.avg_chg)}">${pct(s.avg_chg)}</span></div>
      <div><span>Avg best</span><span class="${cls(s.avg_best)}">${pct(s.avg_best)}</span></div>
    </div>`).join("");
  const chip = (group, v) => `<button data-${group}="${esc(v)}" class="${state[group] === v ? "on" : ""}">${esc(v)}</button>`;
  return `
    <div class="stats">${stats}</div>
    <div class="filters">${names.map((n) => chip("scanner", n)).join("")}</div>
    <div class="filters">${["All", "BUY", "HOLD"].map((v) => chip("status", v)).join("")}</div>
    <section class="card">
      <h2>Triggers, last ${d.window_days} days <small>${rows.length}</small></h2>
      ${rows.length ? rows.map((b) => `
        <div class="row">
          <div><div class="sym">${esc(b.symbol)}${b.on_scan ? '<span class="dot" title="still on the scanner"></span>' : ""}</div>
            <div class="meta">${esc(b.scanner)} · ${fmtDate(b.date)} · trigger ${money(b.trigger)} → ${money(b.now)}${b.seen != null && b.seen !== b.trigger ? " · seen at " + money(b.seen) : ""}${b.best_chg != null ? " · best " + pct(b.best_chg) : ""}${b.days != null ? " · " + b.days + "d" : ""}</div></div>
          <div class="num chg ${cls(b.chg)}">${pct(b.chg)}</div>
          <span class="pill ${b.status}">${b.status}</span>
        </div>`).join("") : `<div class="empty">No triggers match.</div>`}
    </section>
    <footer>● still on the scanner · best = highest price since the trigger</footer>`;
}

function spark(weekly) {
  const max = Math.max(1, ...weekly), w = 6, gap = 2, h = 22;
  const bars = weekly.map((v, i) => {
    const bh = v ? Math.max(2, Math.round((v / max) * h)) : 1;
    return `<rect x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="1" class="${i === weekly.length - 1 ? "last" : ""}"/>`;
  }).join("");
  return `<svg class="spark" width="${weekly.length * (w + gap) - gap}" height="${h}" aria-hidden="true">${bars}</svg>`;
}

function trend(r) {
  if (r.cur > r.prev) return `<span class="up">▲ from ${r.prev}</span>`;
  if (r.cur < r.prev) return `<span class="down">▼ from ${r.prev}</span>`;
  return `<span class="meta">= ${r.prev}</span>`;
}

function renderSectors(d) {
  const m = d.sector_momentum;
  const momentum = m && m.rows.length ? `
    <section class="card">
      <h2>Sector momentum <small>all scanners</small></h2>
      <div class="note">Stocks picked in the last ${m.days} days, each counted once, vs the ${m.days} days before. Bars = last ${m.weeks} weeks.</div>
      ${m.rows.map((r) => `
        <div class="row srow">
          <div><div class="sym">${esc(r.sector)}</div>
            <div class="meta">${r.scanners.length}/${m.scanner_count} scanners${r.avg_move != null ? ` · avg <span class="${cls(r.avg_move)}">${pct(r.avg_move)}</span>` : ""}${r.recent.length ? " · " + r.recent.slice(0, 3).map(esc).join(", ") + (r.recent.length > 3 ? " +" + (r.recent.length - 3) : "") : ""}</div></div>
          ${spark(r.weekly)}
          <div class="num"><div class="big">${r.cur}</div><div class="tiny">${trend(r)}</div></div>
        </div>`).join("")}
      <div class="note">avg = average move of the sector's picks since each was picked (last ${2 * m.days} days)</div>
    </section>` : "";
  const byScanner = Object.entries(d.sectors).map(([name, rows]) => `
    <section class="card">
      <h2>${esc(name)} <small>backtest picks</small></h2>
      ${rows.length ? `<table><tr><th>Sector</th><th class="n">7d</th><th class="n">30d</th></tr>
        ${rows.map(([s, w, mo]) => `<tr><td>${esc(s)}</td><td class="n">${w}</td><td class="n">${mo}</td></tr>`).join("")}</table>`
        : `<div class="empty">No picks in the last 30 days.</div>`}
    </section>`).join("");
  return momentum + `<h3 class="section">By scanner</h3>` + byScanner;
}

const SHORT = { "63_30_daily": "63/30", "Bullish_Scanner": "Bullish", "Wkly_upswing": "Weekly" };
const scanTag = (n) => `<span class="tag">${esc(SHORT[n] || n)}</span>`;
const fundTag = (f) => {
  if (!f || !f.screen || !f.screen.checked) return "";
  const sc = f.screen, tip = [...(sc.fails || []), ...(sc.unknown || []).map((u) => u + " not checked"),
    f.score != null ? `Valuepick ${Math.round(f.score)} ${f.verdict}` : ""].filter(Boolean).join(" · ");
  if (!sc.ok && !sc.fails.length) return ` <span class="tag" title="${esc(tip)}">? data</span>`;
  return sc.ok ? ` <span class="tag up" title="${esc(tip)}">✓ ${sc.passed}/${sc.checked}</span>`
               : ` <span class="tag down" title="${esc(tip)}">✗ ${sc.fails.length}</span>`;
};
const fundLine = (f) => {
  if (!f || !f.screen || !f.screen.checked) return "";
  const sc = f.screen;
  const head = sc.ok ? `passes your screen (${sc.passed}/${sc.checked})`
    : sc.fails.length ? `fails your screen: ${sc.fails.map(esc).join("; ")}` : `screen: not enough data (${sc.checked}/${sc.total})`;
  const src = f.asof ? ` (Screener, ${fmtDate(f.asof)})` : f.source === "Yahoo" ? " (Yahoo)" : "";
  return ` · ${head}${f.score != null ? ` · Valuepick ${Math.round(f.score)}` : ""}${f.bank ? " · bank: ROE used, OPM and debt/equity not applicable" : ""}${src}`;
};
const evTag = (sym) => { const e = (state.data && state.data.events || {})[sym];
  return e ? ` <span class="tag" style="background:var(--hold-bg);color:var(--hold)">📅 ${esc(e.what)} ${fmtDate(e.date)}</span>` : ""; };

function renderMarket(d) {
  const m = d.market;
  if (!m || !m.indexes || !m.indexes.length) return "";
  const sign = (v) => (v == null ? "–" : (v > 0 ? "+" : "") + v + "%");
  const ix = m.indexes.map((x) => `<div class="meta" style="color:var(--text)"><b>${esc(x.name)}</b> ${x.close.toLocaleString("en-IN")}
      <span class="${cls(x.day)}">${sign(x.day)}</span> today · ${sign(x.month)} in a month ·
      ${x.vs50 == null ? "" : (x.vs50 >= 0 ? "above" : "below") + " 50-day"}${x.vs200 == null ? "" : ", " + (x.vs200 >= 0 ? "above" : "below") + " 200-day"}</div>`).join("");
  const tcls = m.trend === "Uptrend" ? "up" : m.trend === "Downtrend" ? "down" : "";
  const b = m.breadth && m.breadth.total ? `<div class="meta">${m.breadth.pct}% of the ${m.breadth.total} tracked stocks are above their 50-day average</div>` : "";
  const sec = (m.sectors_up.length || m.sectors_down.length) ? `<div class="meta">Sectors gaining picks: ${esc(m.sectors_up.join(", ") || "–")} · losing: ${esc(m.sectors_down.join(", ") || "–")}</div>` : "";
  const n = m.indexes[0];
  return `<details class="card"><summary>Market <span class="meta"><b class="${tcls}">${esc(m.trend || "")}</b> · Nifty <span class="${cls(n.day)}">${sign(n.day)}</span>${m.vix ? ` · VIX ${m.vix.level}` : ""}</span></summary>
    <div style="padding:0 14px 12px;display:grid;gap:4px">${ix}${b}${sec}
    <div class="meta" style="font-size:11.5px">Context only: a market-trend filter didn't improve your backtest, so it never changes a buy or sell.</div></div></details>`;
}

const lakh = (v) => "₹" + (v / 100000).toFixed(2) + "L";

function renderToday(d, part) {
  const z = d.dip;
  if (!z) return `<section class="card"><div class="empty">No data in this scan yet.</div></section>`;
  const stake = z.rule.stake, slots = (d.performance && d.performance.portfolio && d.performance.portfolio.max_pos) || 15;
  const hold = z.holding, sold = z.closed || [];
  const sells = hold.filter((h) => h.sell_signal);
  const stops = z.buy_list.filter((b) => b.stage === "breakout");
  const cutoff = new Date(Date.now() - 4 * 864e5).toISOString().slice(0, 10);
  const bought = hold.filter((h) => h.entry_date >= cutoff && !h.sell_signal);
  const soldNow = sold.filter((c) => c.exit_date >= cutoff);
  const passed = z.passed || [];
  const invested = hold.length * stake, value = hold.reduce((a, h) => a + (h.value ?? stake), 0);
  const openPnl = value - invested, booked = sold.reduce((a, c) => a + c.pnl, 0);

  const summary = `<div class="summary">
    <div><span>Holding</span><b>${hold.length}<small class="meta">/${slots}</small></b></div>
    <div><span>Open P&amp;L</span><b class="${cls(openPnl)}">${rupees(openPnl)}</b></div>
    <div><span>Booked P&amp;L</span><b class="${cls(booked)}">${rupees(booked)}</b></div>
  </div><div class="meta" style="margin:-4px 2px 4px">Paper trades of ₹1L each · returns after 0.25% costs (brokerage, taxes, slippage)</div>`;

  const held = Object.fromEntries(hold.map((h) => [h.symbol, h]));
  const waiting = Object.fromEntries(z.buy_list.map((b) => [b.symbol, b]));
  const actions = [
    ...sells.map((h) => `<div class="row"><div><div class="sym">🔻 Sell ${esc(h.symbol)}${scanTag(h.scanner)}</div>
        <div class="meta">At the next open · closed below its 50-day average ${money(h.ma)}</div></div>
        <div class="num chg ${cls(h.ret)}">${pct(h.ret)}</div></div>`),
    ...stops.map((b) => `<details class="row fs" style="display:block"><summary style="list-style:none;cursor:pointer">
        <div class="sym">🟡 Buy ${esc(b.symbol)} above ${money(b.level)}${scanTag(b.scanner)}${fundTag(b.fund)}${evTag(b.symbol)}</div>
        <div class="meta">Until ${b.valid_until ? fmtDate(b.valid_until) : "–"} · stop ${money(b.stop)} if bought · now ${money(b.now)}${CHOICE[b.priority] ? " · " + CHOICE[b.priority] : ""}</div></summary>
        ${b.fund ? `<div class="meta" style="padding-top:6px">Fundamentals${fundLine(b.fund)}</div>` : ""}</details>`),
  ];
  const ev = d.events || {};
  const evRows = Object.entries(ev).filter(([sym]) => held[sym] || waiting[sym]).sort((a, b) => a[1].date.localeCompare(b[1].date));
  if (evRows.length) actions.push(`<div class="row"><div><div class="sym">📅 Results coming</div>
      <div class="meta">${evRows.map(([sym, e]) => `<b>${esc(sym)}</b> ${fmtDate(e.date)}${e.what !== "results" ? " (" + esc(e.what) + ")" : ""} · ${held[sym] ? "holding" : "buy-stop"}`).join(" · ")} · prices can jump either way on results day</div></div><div></div></div>`);
  const done = [
    ...bought.map((h) => `<div class="row"><div><div class="sym">🟢 Bought ${esc(h.symbol)}${scanTag(h.scanner)}${fundTag(h.fund)}</div>
        <div class="meta">${fmtDate(h.entry_date)} at ${money(h.entry)} · stop ${money(h.stop)}</div></div>
        <div class="num chg ${cls(h.ret)}">${pct(h.ret)}</div></div>`),
    ...soldNow.map((c) => `<div class="row"><div><div class="sym">${c.ret >= 0 ? "✅" : "🛑"} Sold ${esc(c.symbol)}${scanTag(c.scanner)}</div>
        <div class="meta">${fmtDate(c.exit_date)} at ${money(c.exit)} · ${SELL[c.reason] || esc(c.reason)}</div></div>
        <div class="num chg ${cls(c.ret)}">${pct(c.ret)}</div></div>`),
  ];
  // Every stock on the scanners in the latest scan, with what the rule did with it.
  const why = Object.fromEntries(passed.map((p) => [p.scanner + "|" + p.symbol, p.why.split(":")[0]]));
  const pending = Object.fromEntries((z.pending || []).map((p) => [p.scanner + "|" + p.symbol, p]));
  const bySym = {};
  for (const g of d.scanners || []) for (const r of g.rows) (bySym[r.symbol] ||= { ...r, scanners: [] }).scanners.push(g.name);
  const onScan = Object.values(bySym);
  const scanRows = onScan.map((r) => {
    const h = held[r.symbol], b = waiting[r.symbol];
    const newOn = r.scanners.filter((sc) => pending[sc + "|" + r.symbol]);
    const reason = r.scanners.map((sc) => why[sc + "|" + r.symbol]).find(Boolean);
    let chip, note;
    if (h) { chip = `<span class="pill BUY">Holding ${pct(h.ret)}</span>`; note = `bought ${fmtDate(h.entry_date)} at ${money(h.entry)}`; }
    else if (b) { chip = `<span class="pill HOLD">Buy-stop</span>`; note = `buy above ${money(b.level)} until ${b.valid_until ? fmtDate(b.valid_until) : "–"}`; }
    else if (newOn.length) {
      const wk = newOn.every((sc) => SHORT[sc] === "Weekly");
      chip = `<span class="pill WAIT">${wk ? "New this week" : "New today"}</span>`;
      note = `buy-stop at the ${wk ? "week's" : "day's"} high, set after the ${wk ? "week's" : ""} close${hold.length >= slots ? " if a slot is free" : ""}`.replace("the  close", "the close");
    } else { chip = `<span class="pill WAIT">${esc(reason || "not taken")}</span>`;
             note = r.trigger != null ? `trigger ${money(r.trigger)} (${r.chg >= 0 ? "above" : "below"}, ${pct(r.chg)})` : ""; }
    return `<div class="row hrow"><div><div class="sym">${esc(r.symbol)}${r.scanners.map(scanTag).join("")}${evTag(r.symbol)}</div>
      <div class="meta">${money(r.now)}${note ? " · " + note : ""}${r.industry ? " · " + esc(r.industry) : ""}</div></div><div class="num">${chip}</div></div>`;
  }).join("");
  const scanCard = `<section class="card"><h2>On the scanners now <small>${onScan.length}</small></h2>
    ${scanRows || `<div class="empty">No stocks on the scanners in the latest scan.</div>`}</section>`;
  const todo = `<section class="card todo"><h2>To do <small>${actions.length || ""}</small></h2>
    ${actions.join("") || `<div class="empty">Nothing to do today.</div>`}
    ${done.length ? `<h2 style="border-top:1px solid var(--line)">Done this week <small>${done.length}</small></h2>${done.join("")}` : ""}
    </section>`;

  const rows = [...hold].sort((a, b) => b.ret - a.ret).map((h) => `
    <div class="row hrow"><div><div class="sym">${esc(h.symbol)}${scanTag(h.scanner)}${fundTag(h.fund)}${evTag(h.symbol)}${h.sell_signal ? ' <span class="pill SELL">SELL</span>' : ""}</div>
      <div class="meta">${money(h.entry)} → ${money(h.now)} · sell below ${money(h.ma)}</div></div>
      <div class="num"><div class="chg ${cls(h.ret)}">${pct(h.ret)}</div><div class="tiny ${cls(h.pnl)}">${rupees(h.pnl)}</div></div></div>`).join("");
  const holdings = `<section class="card"><h2>Holdings <small>${lakh(value)}</small></h2>
    ${rows || `<div class="empty">No open positions.</div>`}</section>`;

  const soldRows = sold.map((c) => `
    <div class="row hrow"><div><div class="sym">${esc(c.symbol)}${scanTag(c.scanner)}</div>
      <div class="meta">${money(c.entry)} → ${money(c.exit)} · ${fmtDate(c.exit_date)} · ${SELL[c.reason] || esc(c.reason)}</div></div>
      <div class="num"><div class="chg ${cls(c.ret)}">${pct(c.ret)}</div><div class="tiny ${cls(c.pnl)}">${rupees(c.pnl)}</div></div></div>`).join("");
  const soldCard = sold.length ? `<details class="card"><summary>Sold <span class="meta">${sold.length} · ${rupees(booked)}</span></summary>${soldRows}</details>` : "";
  const hc = d.health;
  const healthCard = hc ? `<details class="card"><summary>Data check <span class="meta" style="color:${hc.ok ? "var(--up)" : "var(--down)"}">${hc.ok ? "✓ all good" : "⚠ " + hc.checks.filter((c) => !c.ok).length + " issue(s)"}</span></summary>
    ${hc.checks.map((c) => `<div class="row hrow"><div class="meta" style="color:var(--text)">${c.ok ? "✓" : "⚠"} ${esc(c.text)}</div><div></div></div>`).join("")}</details>` : "";
  if (part === "holdings") return summary + holdings + soldCard;
  return summary + renderMarket(d) + todo + scanCard + healthCard;
}

function renderRule(d) {
  const r = d.dip && d.dip.rule;
  if (!r) return "";
  const sec = (t, body) => `<section class="card"><h2>${t}</h2><div class="note" style="font-size:14px;color:var(--text)">${body}</div></section>`;
  return sec("The rule", `
    <b>Buy</b>: when a stock appears on a scanner, place a buy-stop at its <b>trigger</b> (the signal day's high; the week's high for Weekly)
    for ${r.entry_days} sessions (${r.entry_days_weekly} for Weekly). Filled at the trigger, or at the open on a gap-up.<br><br>
    <b>Sell</b>: at the next open after a close below the ${r.exit_ma}-day average, or at the ${r.stop}% stop (${Object.values(r.stop_by || {})[0] || r.stop}% for Weekly), or after a year.<br><br>
    <b>Slots</b>: 15 positions of about 6.7% each, one per stock. If short of slots, mid caps first, then large, then small.<br><br>
    <b>Filters</b>: Weekly only takes calm stocks (daily range under ${Object.values(r.atr_max || {})[0] || 4}%); 63/30 only within ${Object.values(r.near_high || {})[0] || 10}% of the 52-week high.<br><br>
    Paper trades of ₹1L each; returns are after 0.25% costs. Not advice.`)
  + sec("Scans and alerts", `
    Scans at 09:23, 12:23 and 15:23 IST, Monday to Friday; the header shows the next one.
    Telegram sends only today's actions (set a buy-stop, bought, sell, closed). Ask the bot for more:
    /today, /holdings, /scanners, /breakouts, /fundamentals, /help (replies within about 15 minutes).<br><br>
    <b>Data check</b> on Today re-checks every scan: scan freshness, prices, every paper trade against the daily prices, and fundamentals.`)
  + sec("Fundamentals (information only)", `
    Every scanner stock is checked against <b>your main screen</b>
    (price within 20% of the 52w high, market cap ₹100–5,000 Cr, ROCE &gt; 15%, OPM &gt; 5%, debt/equity &lt; 1.1, no pledge,
    promoter &gt; 55%, profit growth &gt; 40% or quarterly YoY &gt; 100%, debtor days &lt; 150, P/E &lt; 20) and scored with your Valuepick logic.
    <span class="tag up">✓</span> = passes every condition it could check; <span class="tag down">✗ 3</span> = fails 3 (tap the card to see which).
    Banks are checked on ROE; OPM, debt/equity and debtor days don't apply to them.<br><br>
    Figures come from each stock's Screener page (monthly), Yahoo if that fails. Pledge isn't on Screener's public pages.
    This page shows which conditions fail; Telegram shows the numbers. It never changes a buy or sell.<br><br>
    <b>Fundamentals</b> (More) ranks every stock in your latest uploaded Screener export.`)
  + sec("Market and results", `
    <b>Market</b> (Today, tap to open): Nifty 50 and Nifty 500 against their 50- and 200-day averages, India VIX,
    how many tracked stocks are above their 50-day average, and the sectors gaining or losing picks.
    Context only: a market-trend filter didn't improve the backtest.<br><br>
    <b>📅 Results</b>: holdings, buy-stops and scanner stocks with results or a board meeting in the next 7 days,
    from the companies' exchange filings (read daily). Prices can jump either way on results day.`)
  + sec("Using the app", `
    Swipe left or right to move between Today and the More pages. Pull down or tap ↻ to refresh.
    Upload (More) takes a new Chartink backtest export (replaces it and retrains) or a Screener export (replaces the Fundamentals list).`);
}

// ---------------------------------------------------------------- upload (straight to GitHub)
const GH = { owner: "r11metoc", repo: "chartink", branch: "claude/scanner-github-breakout-tracking-p7spin" };
const SCANNERS = ["63_30_daily", "Bullish_Scanner", "Wkly_upswing"];
let memToken = "";
const getToken = () => { try { return localStorage.getItem("gh_token") || memToken; } catch { return memToken; } };
const saveToken = (v) => { memToken = v; try { v ? localStorage.setItem("gh_token", v) : localStorage.removeItem("gh_token"); } catch { /* kept for this visit only */ } };

async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`, { ...opts, headers: {
    Authorization: `Bearer ${getToken()}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28",
    ...(opts.body ? { "Content-Type": "application/json" } : {}) } });
  if (!r.ok && r.status !== 404) {
    const m = (await r.json().catch(() => ({}))).message || "";
    throw new Error(r.status === 401 ? "GitHub didn't accept the token (expired or mistyped?)."
      : r.status === 403 || r.status === 404 ? `The token lacks permission (${m}). It needs Contents and Actions: Read and write.` : `GitHub ${r.status}: ${m}`);
  }
  return r;
}

const b64bytes = (buf) => { const u = new Uint8Array(buf); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
const b64text = (t) => b64bytes(new TextEncoder().encode(t).buffer);

async function putFile(path, b64, message) {
  const g = await gh(`/contents/${path}?ref=${encodeURIComponent(GH.branch)}`);
  const sha = g.status === 404 ? undefined : (await g.json()).sha;
  const r = await gh(`/contents/${path}`, { method: "PUT", body: JSON.stringify({ message, content: b64, branch: GH.branch, sha }) });
  if (!r.ok) throw new Error(`Couldn't save ${path} (GitHub ${r.status}).`);
}

async function runWorkflow(file, inputs) {
  const r = await gh(`/actions/workflows/${file}/dispatches`, { method: "POST", body: JSON.stringify({ ref: GH.branch, inputs }) });
  if (r.status !== 204) throw new Error(`Couldn't start ${file} (GitHub ${r.status}).`);
}

function checkBacktest(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
  const head = (lines[0] || "").split(",").map((h) => h.replace(/"/g, "").trim());
  if (!head.includes("Date") || !head.includes("Symbol")) return "This isn't a Chartink backtest export: the first row needs Date and Symbol columns.";
  const di = head.indexOf("Date");
  const bad = lines.slice(1).find((l) => !/^\d{2}-\d{2}-\d{4}$/.test((l.split(",")[di] || "").replace(/"/g, "").trim()));
  if (lines.length < 2) return "The file has no rows.";
  if (bad) return `A date isn't in Chartink's DD-MM-YYYY form: ${bad.slice(0, 60)}`;
  return null;
}

async function loadXlsx() {
  if (window.XLSX) return window.XLSX;
  await new Promise((ok, no) => { const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; sc.onload = ok; sc.onerror = () => no(new Error("Couldn't load the Excel reader.")); document.head.appendChild(sc); });
  return window.XLSX;
}

async function screenerCsv(file) {
  let rows;
  if (/\.xlsx?$/i.test(file.name)) {
    const X = await loadXlsx();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    rows = X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
  } else {
    rows = (await file.text()).replace(/^﻿/, "").split(/\r?\n/).map((l) => l.split(","));
  }
  const at = rows.findIndex((r) => r.some((c) => /^(NSE|BSE) Code$/.test(String(c).replace(/"/g, "").trim())));
  if (at < 0) throw new Error("No 'NSE Code' or 'BSE Code' column found. Export the screen from Screener with those columns.");
  if (!/\.xlsx?$/i.test(file.name)) { const body = rows.slice(at).filter((r) => r.join("").trim()); return { csv: body.map((r) => r.join(",")).join("\n") + "\n", n: body.length - 1 }; }
  const q = (c) => { const v = String(c ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const body = rows.slice(at).filter((r) => r.some((c) => String(c).trim()));
  return { csv: body.map((r) => r.map(q).join(",")).join("\n"), n: body.length - 1 };
}

function upMsg(id, text, kind) { const el = document.getElementById(id); if (el) { el.textContent = text; el.className = "up-msg " + (kind || ""); } }

  const opts = SCANNERS.map((n) => `<option value="${n}">${esc(SHORT[n] || n)} (${n})</option>`).join("");

document.addEventListener("change", (e) => {
  if (e.target.id !== "up-bt-file" || !e.target.files[0]) return;
  const n = e.target.files[0].name, hit = SCANNERS.find((s) => n.includes(s));
  if (hit) document.getElementById("up-bt-scan").value = hit;
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-up]");
  if (!b) return;
  const act = b.dataset.up;
  if (act === "save") { const v = document.getElementById("up-token").value.trim(); if (v) { saveToken(v); render(); } return; }
  if (act === "forget") { saveToken(""); render(); return; }
  const msg = act === "backtest" ? "up-bt-msg" : "up-sc-msg";
  const file = document.getElementById(act === "backtest" ? "up-bt-file" : "up-sc-file").files[0];
  if (!file) return upMsg(msg, "Choose a file first.", "bad");
  b.disabled = true;
  try {
    if (act === "backtest") {
      const scan = document.getElementById("up-bt-scan").value;
      const bad = checkBacktest(await file.text());
      if (bad) throw new Error(bad);
      upMsg(msg, "Uploading…");
      await putFile(`data/backtest/${scan}.csv`, b64bytes(await file.arrayBuffer()), `New backtest export for ${scan} (uploaded from the app)`);
      upMsg(msg, "Uploaded. Starting the retrain…");
      await runWorkflow("signal_model.yml", { mode: "train" });
      await runWorkflow("scan.yml", {});
      upMsg(msg, `Done: ${scan} replaced. Retrain started (30–60 min); a scan is also running to refresh the site.`, "ok");
    } else {
      upMsg(msg, "Reading the file…");
      const { csv, n } = await screenerCsv(file);
      if (n < 1) throw new Error("The export has no rows.");
      const stamp = new Date().toISOString().slice(0, 19).replace("T", "_").replace(/:/g, "");
      const name = `${stamp}.csv`;
      await putFile(`data/fundamentals/uploads/${name}`, b64text(csv), `Screener export, ${n} stocks (uploaded from the app)`);
      upMsg(msg, "Saved. Clearing the previous list…");
      const ls = await gh(`/contents/data/fundamentals/uploads?ref=${encodeURIComponent(GH.branch)}`);
      for (const f of ls.ok ? await ls.json() : []) {
        if (f.type !== "file" || f.name === name) continue;
        const r = await gh(`/contents/${f.path}`, { method: "DELETE", body: JSON.stringify({ message: `Remove old Screener export ${f.name}`, sha: f.sha, branch: GH.branch }) });
        if (!r.ok) throw new Error(`Couldn't remove the old list ${f.name} (GitHub ${r.status}).`);
      }
      await runWorkflow("scan.yml", {});
      upMsg(msg, `Done: ${n} stocks saved. A scan is running; tags of scanner stocks in this export update in a few minutes.`, "ok");
    }
  } catch (err) {
    upMsg(msg, err.message || String(err), "bad");
  } finally { b.disabled = false; }
});

function renderFundScan(d) {
  const f = d.fundscan;
  if (!f) return `<section class="card"><div class="empty">No Screener export yet. Upload one under More → Upload.</div></section>`;
  const all = f.stocks;
  const groups = { Shortlist: (x) => /^Shortlist(?! -)/.test(x.verdict), "Check flags": (x) => x.verdict.startsWith("Shortlist -"), Maybe: (x) => x.verdict.startsWith("Maybe"),
                   "Your screen ✓": (x) => x.screen.ok, All: () => true };
  if (!groups[state.fv]) state.fv = "Shortlist";
  const chips = `<div class="sub2 filters">${Object.entries(groups).map(([k, g]) =>
    `<button data-fv="${esc(k)}" class="${state.fv === k ? "on" : ""}">${esc(k)} ${all.filter(g).length}</button>`).join("")}</div>`;
  const vcls = (v) => v.startsWith("Shortlist") ? "up" : v.startsWith("Reject") || v.startsWith("Skip") ? "down" : "";
  const num = (v, u = "") => (v == null || v === "" ? "–" : `${Math.round(v * 10) / 10}${u}`);
  const rows = all.filter(groups[state.fv]).map((x, i) => {
    const sc = x.screen;
    const scr = sc.ok ? `<span class="tag up">screen ✓ ${sc.passed}/${sc.checked}</span>`
      : sc.fails.length ? `<span class="tag down">screen ✗ ${sc.fails.length}</span>` : `<span class="tag">screen ? ${sc.checked}/${sc.total}</span>`;
    const why = [x.flags && "⚠ " + x.flags, sc.fails.length && "Fails: " + sc.fails.join("; "),
                 sc.unknown.length && "Not in export: " + sc.unknown.join(", ")].filter(Boolean).map(esc).join("<br>");
    return `<details class="row hrow fs" style="display:block"><summary style="list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:8px">
      <div><div class="sym">${i + 1}. ${esc(x.name || x.code)} <span class="tag ${vcls(x.verdict)}">${esc(x.verdict || "no score")}</span>${scr}</div>
        <div class="meta">${esc(x.code)}${x.industry ? " · " + esc(x.industry) : ""}</div>
        <div class="meta">P/E ${num(x.pe)} · ROCE ${num(x.roce, "%")} · promoter ${num(x.promoter, "%")} · ₹${num(x.mcap)} Cr · ${num(x.from_high, "%")} from high${x.entry ? " · " + esc(x.entry) : ""}</div></div>
      <div class="num"><div><b>${x.score == null ? "–" : Math.round(x.score)}</b></div><div class="tiny">Valuepick</div></div></summary>
      ${why ? `<div class="meta" style="padding-top:6px">${why}</div>` : ""}</details>`;
  }).join("");
  return chips + `<section class="card"><h2>Fundamental scan <small>${all.length} stocks</small></h2>
    <details class="about"><summary>How it's scored ▾</summary><div class="note">Every stock in your latest Screener export, scored with your Valuepick logic: Shortlist ≥ 65 with no red flags, Check flags = ≥ 65 but with red flags, Maybe ≥ 50.
    The screen tag is your main screen; ? means the export lacks some of its columns (add P/E, Debt to equity, Pledged percentage and YOY Quarterly profit growth to your Screener screen to check them all).
    Separate from the Chartink scan. Tap a stock for flags and failed checks.${f.asof ? " Latest export " + fmtDate(f.asof) + "." : ""}</div></details>
    ${rows || `<div class="empty">None in this group.</div>`}</section>`;
}

function renderMore(d) {
  const tabs = MORE_TABS;
  if (!tabs[state.more]) state.more = "breakouts";
  const chips = `<div class="sub2 filters">${Object.entries(tabs).map(([k, v]) => `<button data-more="${k}" class="${state.more === k ? "on" : ""}">${v}</button>`).join("")}</div>`;
  const body = { holdings: (x) => renderToday(x, "holdings"), rule: renderRule, backtest: (x) => renderPerformance(x.performance) || `<div class="empty">No backtest yet.</div>`,
                 fund: renderFundScan, upload: renderUpload, breakouts: renderBreakouts, sectors: renderSectors }[state.more](d);
  return chips + body;
}

const MORE_TABS = { breakouts: "Breakouts", holdings: "Holdings", sectors: "Sectors", backtest: "Backtest",
                    fund: "Fundamentals", upload: "Upload", rule: "How it works" };

function render() {
  const d = state.data;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (!d) return;
  if (!{ today: 1, more: 1 }[state.tab]) state.tab = "today";
  $("#view").innerHTML = { today: renderToday, more: renderMore }[state.tab](d);
  try { localStorage.setItem("view", JSON.stringify({ tab: state.tab, more: state.more, fv: state.fv })); } catch { /* fine */ }
  const on = document.querySelector(".sub2 button.on[data-more]");
  if (on) on.scrollIntoView({ block: "nearest", inline: "center" });
}

// Swipe left/right to move between pages: Today, then each More tab in order.
const PAGES = ["today", ...Object.keys(MORE_TABS).map((k) => "more:" + k)];
function goPage(step) {
  const cur = state.tab === "today" ? "today" : "more:" + state.more;
  const next = PAGES[PAGES.indexOf(cur) + step];
  if (!next) return;
  if (next === "today") state.tab = "today"; else { state.tab = "more"; state.more = next.slice(5); }
  render();
  window.scrollTo(0, 0);
  const v = $("#view");
  v.style.transition = "none"; v.style.transform = `translateX(${step * 40}px)`; v.style.opacity = "0.4";
  requestAnimationFrame(() => { v.style.transition = "transform .18s ease-out, opacity .18s"; v.style.transform = ""; v.style.opacity = ""; });
}
let sw = null;
const scrollsSideways = (el) => {
  for (; el && el !== document.body; el = el.parentElement)
    if (el.scrollWidth > el.clientWidth + 2 && /(auto|scroll)/.test(getComputedStyle(el).overflowX)) return true;
  return false;
};
document.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  sw = e.touches.length === 1 && !scrollsSideways(e.target) && !e.target.closest("input,select,textarea")
    ? { x: t.clientX, y: t.clientY, at: Date.now() } : null;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!sw) return;
  const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (Math.abs(dx) > 70 && Math.abs(dx) > 2 * Math.abs(dy) && Date.now() - sw.at < 700) goPage(dx < 0 ? 1 : -1);
  sw = null;
}, { passive: true });

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; window.scrollTo(0, 0); }
  else if (t.dataset.scanner) state.scanner = t.dataset.scanner;
  else if (t.dataset.status) state.status = t.dataset.status;
  else if (t.dataset.more) state.more = t.dataset.more;
  else if (t.dataset.fv) state.fv = t.dataset.fv;
  else return;
  render();
});

function nextScan(slots) {
  // Scans run at the slot times (IST), Monday to Friday.
  const ist = new Date(Date.now() + (330 + new Date().getTimezoneOffset()) * 60e3);
  const hm = ist.getHours() * 60 + ist.getMinutes(), wd = ist.getDay();
  const mins = slots.map((t) => +t.slice(0, 2) * 60 + +t.slice(3));
  if (wd >= 1 && wd <= 5) { const i = mins.findIndex((m) => m > hm); if (i >= 0) return `next scan ${slots[i]}`; }
  const nextDay = wd === 5 || wd === 6 ? "Monday" : "tomorrow";
  return `next scan ${nextDay} ${slots[0]}`;
}
let loadedAt = 0;
async function load() {
  const btn = $("#refresh");
  btn.classList.add("spin");
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    const cached = r.headers.get("X-From-Cache") === "1";
    $("#offline").innerHTML = cached ? `<div class="offline">Offline: showing the data saved on this phone.</div>` : "";
    state.data = d;
    loadedAt = Date.now();
    $("#updated").textContent = `Updated ${fmtWhen(d.last_scan)} · ${nextScan(d.slots || ["09:23", "12:23", "15:23"])}`;
    render();
  } catch (e) {
    if (!state.data) $("#view").innerHTML = `<div class="err">Couldn't load the data (${esc(e.message)}). Pull down to refresh.</div>`;
    else $("#offline").innerHTML = `<div class="offline">Couldn't refresh (offline?). Showing the last data.</div>`;
  } finally { btn.classList.remove("spin"); }
}
$("#refresh").addEventListener("click", load);
// Reopening the app after a while fetches fresh data.
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - loadedAt > 5 * 60e3) load(); });
// Pull to refresh (the home-screen app has no browser pull-down).
let y0 = null, pulled = 0;
window.addEventListener("touchstart", (e) => { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; pulled = 0; }, { passive: true });
window.addEventListener("touchmove", (e) => {
  if (y0 == null) return;
  pulled = Math.max(0, e.touches[0].clientY - y0);
  $("#ptr").style.height = Math.min(pulled / 2, 40) + "px";
  $("#ptr").textContent = pulled > 80 ? "Release to refresh" : "Pull to refresh";
}, { passive: true });
window.addEventListener("touchend", () => {
  if (y0 != null && pulled > 80) load();
  y0 = null; $("#ptr").style.height = "0";
});
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
  // When a new version of the app takes over, reload once to show it.
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
load();
</script>
</body>
</html>
