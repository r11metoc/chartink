<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scanner">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="robots" content="noindex">
<title>Scanner Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M12 44l12-12 9 9 19-21' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #111827; --muted: #6b7280; --line: #e5e7eb;
    --accent: #0f766e; --buy: #15803d; --buy-bg: #dcfce7; --hold: #92400e; --hold-bg: #fef3c7;
    --up: #15803d; --down: #b91c1c; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14; --card: #151b23; --text: #e5e7eb; --muted: #9aa4b2; --line: #263040;
      --accent: #2dd4bf; --buy: #4ade80; --buy-bg: #12301f; --hold: #fbbf24; --hold-bg: #33270d;
      --up: #4ade80; --down: #f87171; --chip: #1e2733;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 18px 16px 8px; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  nav { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 8px 16px; display: flex; gap: 6px; }
  nav button {
    flex: 1; border: 0; border-radius: 10px; padding: 9px 0; font: inherit; font-weight: 600;
    background: var(--chip); color: var(--muted); cursor: pointer;
  }
  nav button.on { background: var(--accent); color: #fff; }
  main { padding: 4px 16px 32px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 12px 0; overflow: hidden; }
  .card h2 { font-size: 16px; margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .empty { color: var(--muted); padding: 4px 14px 14px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .sym { font-weight: 650; }
  .meta { color: var(--muted); font-size: 12.5px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .chg { font-weight: 650; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 3px 8px; letter-spacing: .02em; }
  .pill.BUY { color: var(--buy); background: var(--buy-bg); }
  .pill.HOLD { color: var(--hold); background: var(--hold-bg); }
  .pill.WAIT { color: var(--muted); background: var(--chip); }
  .pill.SELL { color: var(--down); background: color-mix(in srgb, var(--down) 14%, transparent); }
  .lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 14px 10px; font-size: 12.5px; }
  .lv div { background: var(--chip); border-radius: 8px; padding: 5px 8px; }
  .lv span { display: block; color: var(--muted); font-size: 11px; }
  .lv b { font-variant-numeric: tabular-nums; }
  .track { margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .stat b { display: block; font-size: 13px; margin-bottom: 6px; }
  .stat div { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .stat div span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
  .filters button {
    border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .filters button.on { border-color: var(--accent); color: var(--accent); font-weight: 650; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--up); margin-left: 4px; vertical-align: middle; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 14px; border-top: 1px solid var(--line); text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.tight th, table.tight td { padding: 8px 10px; }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 8px 16px 24px; }
  .err { color: var(--down); padding: 16px; }
  .note { color: var(--muted); font-size: 12.5px; padding: 0 14px 10px; }
  .srow { grid-template-columns: 1fr auto 64px; }
  .spark rect { fill: var(--muted); opacity: .45; }
  .spark rect.last { fill: var(--accent); opacity: 1; }
  .big { font-size: 20px; font-weight: 700; line-height: 1.1; }
  .tiny { font-size: 11.5px; white-space: nowrap; }
  h3.section { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 22px 2px 4px; }
  .todo .row { grid-template-columns: 1fr auto; }
  .hrow { grid-template-columns: 1fr auto; padding: 9px 14px; }
  .hrow .meta { font-size: 12px; }
  .tag { font-size: 10.5px; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
  .summary div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .summary span { display: block; font-size: 11.5px; color: var(--muted); }
  .summary b { font-size: 17px; font-variant-numeric: tabular-nums; }
  details.card summary { cursor: pointer; padding: 12px 14px; font-weight: 650; list-style: none; display: flex; justify-content: space-between; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::after { content: "▾"; color: var(--muted); }
  details[open].card summary::after { content: "▴"; }
  .sub2 { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
</style>
</head>
<body>
<header>
  <h1>Scanner Tracker</h1>
  <div class="sub" id="updated">Loading…</div>
</header>
<nav>
  <button data-tab="today" class="on">Today</button>
  <button data-tab="more">More</button>
</nav>
<main id="view"></main>
<footer>Paper trades from your Chartink scanners. Not advice.</footer>

<script>
const state = { tab: "today", more: "rule", scanner: "All", status: "All", data: null };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (v) => (v == null ? "–" : "₹" + Number(v).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const pct = (v) => (v == null ? "–" : (v > 0 ? "+" : "") + v.toFixed(2) + "%");
const cls = (v) => (v == null || v === 0 ? "" : v > 0 ? "up" : "down");
const fmtDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
const fmtYear = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-IN", { month: "short", year: "numeric" });
const fmtWhen = (iso) => new Date(iso).toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Kolkata" }) + " IST";

const rupees = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + "₹" + Math.abs(v).toLocaleString("en-IN");

const lv = (items) => `<div class="lv">${items.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join("")}</div>`;

const STAGE = {
  zone: ["BUY", "BUY ZONE"],
  dip: ["HOLD", "WAIT DIP"],
  breakout: ["BUY", "BUY-STOP"],
};
const CHOICE = { 0: "1st choice", 1: "2nd choice", 2: "3rd choice" };
const SELL = { target: "target", stop: "stop", time: "time limit", average: "below 50-day avg" };
const tags = (x) => (x.confirmed_by && x.confirmed_by.length ? ` · <b class="up">⭐ also on ${x.confirmed_by.map(esc).join(", ")}</b>` : "")
  + (x.off_high != null ? ` · ${Math.abs(x.off_high).toFixed(0)}% off 52w high` : "");

function equityChart(m) {
  const pts = m.filter((x) => x.v != null);
  if (pts.length < 2) return "";
  const vals = pts.flatMap((x) => [x.v, x.b]).filter((v) => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), W = 600, H = 150, pad = 4;
  const X = (i) => pad + (i * (W - 2 * pad)) / (pts.length - 1);
  const Y = (v) => H - pad - ((v - lo) / (hi - lo || 1)) * (H - 2 * pad);
  const line = (key) => pts.map((x, i) => (x[key] == null ? "" : `${X(i).toFixed(1)},${Y(x[key]).toFixed(1)}`)).filter(Boolean).join(" ");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;padding:0 14px 4px" role="img" aria-label="Portfolio value against the Nifty 500">
    <polyline points="${line("b")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 4"/>
    <polyline points="${line("v")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/></svg>
    <div class="note"><span style="color:var(--accent)">━</span> alerts portfolio &nbsp; <span>┅</span> Nifty 500 · ${esc(pts[0].m)} to ${esc(pts[pts.length - 1].m)}</div>`;
}

function renderPerformance(f) {
  if (!f) return "";
  const p = f.portfolio, b = f.bench;
  const L = (v) => "₹" + (v / 100000).toFixed(1) + "L";
  const sc = f.per_scanner.map((r) => `<tr><td>${esc(r.group)}</td><td class="n">${r.trades}</td><td class="n">${r.win}%</td>
    <td class="n ${cls(r.avg)}">${pct(r.avg)}</td><td class="n">${r.days}d</td></tr>`).join("");
  const yrs = f.years.map((y) => `<tr><td>${y.year}</td><td class="n ${cls(y.ret)}">${y.ret > 0 ? "+" : ""}${y.ret}%</td>
    <td class="n ${cls(y.bench)}">${y.bench == null ? "–" : (y.bench > 0 ? "+" : "") + y.bench + "%"}</td></tr>`).join("");
  return `<section class="card"><h2>📈 If you had bought on the alerts <small>backtest since ${fmtYear(f.start)}</small></h2>
    <div class="note">Starting with ₹${p.capital / 100000}L, each buy is 1/${p.max_pos} of the portfolio's value at the time (profits reinvested),
      at most ${p.max_pos} open, first come first served, after costs.</div>
    <div class="lv"><div><span>₹${p.capital / 100000}L became</span><b>${L(p.final)}</b></div>
      <div><span>Per year</span><b class="${cls(p.cagr)}">${p.cagr}%</b></div>
      <div><span>Worst fall</span><b class="down">${p.max_dd}%</b></div></div>
    ${b ? `<div class="lv"><div><span>Nifty 500 instead</span><b>${L(b.final)}</b></div>
      <div><span>Per year</span><b class="${cls(b.cagr)}">${b.cagr}%</b></div>
      <div><span>Worst fall</span><b class="down">${b.max_dd}%</b></div></div>` : ""}
    ${equityChart(f.monthly)}
    <table class="tight"><tr><th>Every alert</th><th class="n">Trades</th><th class="n">Won</th><th class="n">Avg</th><th class="n">Held</th></tr>${sc}</table>
    <table class="tight"><tr><th>Year</th><th class="n">Alerts</th><th class="n">Nifty 500</th></tr>${yrs}</table>
    ${(f.exits || []).length ? `<h2 style="padding-top:14px">Exit rules compared <small>same dip buys</small></h2>
      <table class="tight"><tr><th>Sell when</th><th class="n">Won</th><th class="n">Avg</th><th class="n">Held</th><th class="n">Per year</th><th class="n">Worst</th></tr>
      ${f.exits.map((x) => `<tr><td>${esc(x.label)}</td><td class="n">${x.win}%</td><td class="n ${cls(x.avg)}">${pct(x.avg)}</td>
        <td class="n">${x.days}d</td><td class="n ${cls(x.cagr)}">${x.cagr}%</td><td class="n down">${x.max_dd}%</td></tr>`).join("")}</table>
      <div class="note" style="padding-top:6px">All keep the starting 12% stop (15% Wkly_upswing); riding exits sell after a year at the latest.</div>` : ""}
    <div class="note" style="padding-top:8px">${p.taken} trades taken, ${p.skipped} skipped for want of a free slot (${p.win}% of those taken won).
      Open positions counted at cost; this year is year-to-date. Past results, not a promise.</div></section>`;
}

function renderNow(d) {
  return d.scanners.map((s) => `
    <section class="card">
      <h2>${esc(s.name)} <small>${s.rows.length} stock${s.rows.length === 1 ? "" : "s"}</small></h2>
      ${s.rows.length ? s.rows.map((r) => `
        <div class="row">
          <div><div class="sym">${esc(r.symbol)}</div>
            <div class="meta">${money(r.now)} · trigger ${money(r.trigger)}${r.trigger_date ? " (" + fmtDate(r.trigger_date) + " high)" : ""}${r.seen != null && r.seen !== r.trigger ? " · seen at " + money(r.seen) : ""}${r.industry ? " · " + esc(r.industry) : ""}</div></div>
          <div class="num chg ${cls(r.chg)}">${pct(r.chg)}</div>
          <span class="pill ${r.status}">${r.status}</span>
        </div>`).join("") : `<div class="empty">No stocks on this scanner right now.</div>`}
    </section>`).join("");
}

function renderBreakouts(d) {
  const names = ["All", ...new Set(d.breakouts.map((b) => b.scanner))];
  const rows = d.breakouts.filter((b) =>
    (state.scanner === "All" || b.scanner === state.scanner) && (state.status === "All" || b.status === state.status));
  const stats = d.stats.map((s) => `
    <div class="stat"><b>${esc(s.scanner)}</b>
      <div><span>Triggers</span><span>${s.count}</span></div>
      <div><span>Above trigger</span><span>${s.above} (${Math.round((s.above / s.count) * 100)}%)</span></div>
      <div><span>Avg move</span><span class="${cls(s.avg_chg)}">${pct(s.avg_chg)}</span></div>
      <div><span>Avg best</span><span class="${cls(s.avg_best)}">${pct(s.avg_best)}</span></div>
    </div>`).join("");
  const chip = (group, v) => `<button data-${group}="${esc(v)}" class="${state[group] === v ? "on" : ""}">${esc(v)}</button>`;
  return `
    <div class="stats">${stats}</div>
    <div class="filters">${names.map((n) => chip("scanner", n)).join("")}</div>
    <div class="filters">${["All", "BUY", "HOLD"].map((v) => chip("status", v)).join("")}</div>
    <section class="card">
      <h2>Triggers, last ${d.window_days} days <small>${rows.length}</small></h2>
      ${rows.length ? rows.map((b) => `
        <div class="row">
          <div><div class="sym">${esc(b.symbol)}${b.on_scan ? '<span class="dot" title="still on the scanner"></span>' : ""}</div>
            <div class="meta">${esc(b.scanner)} · ${fmtDate(b.date)} · trigger ${money(b.trigger)} → ${money(b.now)}${b.seen != null && b.seen !== b.trigger ? " · seen at " + money(b.seen) : ""}${b.best_chg != null ? " · best " + pct(b.best_chg) : ""}${b.days != null ? " · " + b.days + "d" : ""}</div></div>
          <div class="num chg ${cls(b.chg)}">${pct(b.chg)}</div>
          <span class="pill ${b.status}">${b.status}</span>
        </div>`).join("") : `<div class="empty">No triggers match.</div>`}
    </section>
    <footer>● still on the scanner · best = highest price since the trigger</footer>`;
}

function spark(weekly) {
  const max = Math.max(1, ...weekly), w = 6, gap = 2, h = 22;
  const bars = weekly.map((v, i) => {
    const bh = v ? Math.max(2, Math.round((v / max) * h)) : 1;
    return `<rect x="${i * (w + gap)}" y="${h - bh}" width="${w}" height="${bh}" rx="1" class="${i === weekly.length - 1 ? "last" : ""}"/>`;
  }).join("");
  return `<svg class="spark" width="${weekly.length * (w + gap) - gap}" height="${h}" aria-hidden="true">${bars}</svg>`;
}

function trend(r) {
  if (r.cur > r.prev) return `<span class="up">▲ from ${r.prev}</span>`;
  if (r.cur < r.prev) return `<span class="down">▼ from ${r.prev}</span>`;
  return `<span class="meta">= ${r.prev}</span>`;
}

function renderSectors(d) {
  const m = d.sector_momentum;
  const momentum = m && m.rows.length ? `
    <section class="card">
      <h2>Sector momentum <small>all scanners</small></h2>
      <div class="note">Stocks picked in the last ${m.days} days, each counted once, vs the ${m.days} days before. Bars = last ${m.weeks} weeks.</div>
      ${m.rows.map((r) => `
        <div class="row srow">
          <div><div class="sym">${esc(r.sector)}</div>
            <div class="meta">${r.scanners.length}/${m.scanner_count} scanners${r.avg_move != null ? ` · avg <span class="${cls(r.avg_move)}">${pct(r.avg_move)}</span>` : ""}${r.recent.length ? " · " + r.recent.slice(0, 3).map(esc).join(", ") + (r.recent.length > 3 ? " +" + (r.recent.length - 3) : "") : ""}</div></div>
          ${spark(r.weekly)}
          <div class="num"><div class="big">${r.cur}</div><div class="tiny">${trend(r)}</div></div>
        </div>`).join("")}
      <div class="note">avg = average move of the sector's picks since each was picked (last ${2 * m.days} days)</div>
    </section>` : "";
  const byScanner = Object.entries(d.sectors).map(([name, rows]) => `
    <section class="card">
      <h2>${esc(name)} <small>backtest picks</small></h2>
      ${rows.length ? `<table><tr><th>Sector</th><th class="n">7d</th><th class="n">30d</th></tr>
        ${rows.map(([s, w, mo]) => `<tr><td>${esc(s)}</td><td class="n">${w}</td><td class="n">${mo}</td></tr>`).join("")}</table>`
        : `<div class="empty">No picks in the last 30 days.</div>`}
    </section>`).join("");
  return momentum + `<h3 class="section">By scanner</h3>` + byScanner;
}

const SHORT = { "63_30_daily": "63/30", "Bullish_Scanner": "Bullish", "Wkly_upswing": "Weekly" };
const scanTag = (n) => `<span class="tag">${esc(SHORT[n] || n)}</span>`;
const fundTag = (f) => {
  if (!f || f.score == null) return "";
  const v = f.verdict || "";
  const c = v.startsWith("Shortlist") && !f.flags ? "up" : v.startsWith("Skip") || v.startsWith("Reject") ? "down" : "";
  return ` <span class="tag ${c}" title="${esc(v)}${f.flags ? " · " + esc(f.flags) : ""}">F ${Math.round(f.score)}</span>`;
};
const fundLine = (f) => (f && f.score != null ? ` · fundamentals ${Math.round(f.score)} ${esc(f.verdict)}${f.flags ? " (" + esc(f.flags) + ")" : ""}` : "");
const lakh = (v) => "₹" + (v / 100000).toFixed(2) + "L";

function renderToday(d) {
  const z = d.dip;
  if (!z) return `<section class="card"><div class="empty">No data in this scan yet.</div></section>`;
  const stake = z.rule.stake, slots = (d.performance && d.performance.portfolio && d.performance.portfolio.max_pos) || 15;
  const hold = z.holding, sold = z.closed || [];
  const sells = hold.filter((h) => h.sell_signal);
  const stops = z.buy_list.filter((b) => b.stage === "breakout");
  const cutoff = new Date(Date.now() - 4 * 864e5).toISOString().slice(0, 10);
  const bought = hold.filter((h) => h.entry_date >= cutoff && !h.sell_signal);
  const invested = hold.length * stake, value = hold.reduce((a, h) => a + (h.value ?? stake), 0);
  const openPnl = value - invested, booked = sold.reduce((a, c) => a + c.pnl, 0);

  const summary = `<div class="summary">
    <div><span>Holding</span><b>${hold.length}<small class="meta">/${slots}</small></b></div>
    <div><span>Open P&amp;L</span><b class="${cls(openPnl)}">${rupees(openPnl)}</b></div>
    <div><span>Booked P&amp;L</span><b class="${cls(booked)}">${rupees(booked)}</b></div>
  </div>`;

  const items = [
    ...sells.map((h) => `<div class="row"><div><div class="sym">🔻 Sell ${esc(h.symbol)}${scanTag(h.scanner)}</div>
        <div class="meta">At the next open · closed below its 50-day average ${money(h.ma)}</div></div>
        <div class="num chg ${cls(h.ret)}">${pct(h.ret)}</div></div>`),
    ...stops.map((b) => `<div class="row"><div><div class="sym">🟡 Buy ${esc(b.symbol)} above ${money(b.level)}${scanTag(b.scanner)}${fundTag(b.fund)}</div>
        <div class="meta">Buy-stop${b.valid_until ? " until " + fmtDate(b.valid_until) : ""} · stop ${money(b.stop)} if bought${CHOICE[b.priority] ? " · " + CHOICE[b.priority] : ""} · now ${money(b.now)}${fundLine(b.fund)}</div></div>
        <div></div></div>`),
    ...bought.map((h) => `<div class="row"><div><div class="sym">🟢 Bought ${esc(h.symbol)}${scanTag(h.scanner)}${fundTag(h.fund)}</div>
        <div class="meta">${fmtDate(h.entry_date)} at ${money(h.entry)} · stop ${money(h.stop)}</div></div>
        <div class="num chg ${cls(h.ret)}">${pct(h.ret)}</div></div>`),
  ];
  const todo = `<section class="card todo"><h2>To do <small>${items.length ? items.length : ""}</small></h2>
    ${items.join("") || `<div class="empty">Nothing to do today.</div>`}</section>`;

  const rows = [...hold].sort((a, b) => b.ret - a.ret).map((h) => `
    <div class="row hrow"><div><div class="sym">${esc(h.symbol)}${scanTag(h.scanner)}${fundTag(h.fund)}${h.sell_signal ? ' <span class="pill SELL">SELL</span>' : ""}</div>
      <div class="meta">${money(h.entry)} → ${money(h.now)} · sell below ${money(h.ma)}</div></div>
      <div class="num"><div class="chg ${cls(h.ret)}">${pct(h.ret)}</div><div class="tiny ${cls(h.pnl)}">${rupees(h.pnl)}</div></div></div>`).join("");
  const holdings = `<section class="card"><h2>Holdings <small>${lakh(value)}</small></h2>
    ${rows || `<div class="empty">No open positions.</div>`}</section>`;

  const soldRows = sold.map((c) => `
    <div class="row hrow"><div><div class="sym">${esc(c.symbol)}${scanTag(c.scanner)}</div>
      <div class="meta">${money(c.entry)} → ${money(c.exit)} · ${fmtDate(c.exit_date)} · ${SELL[c.reason] || esc(c.reason)}</div></div>
      <div class="num"><div class="chg ${cls(c.ret)}">${pct(c.ret)}</div><div class="tiny ${cls(c.pnl)}">${rupees(c.pnl)}</div></div></div>`).join("");
  const soldCard = sold.length ? `<details class="card"><summary>Sold <span class="meta">${sold.length} · ${rupees(booked)}</span></summary>${soldRows}</details>` : "";
  return summary + todo + holdings + soldCard;
}

function renderRule(d) {
  const r = d.dip && d.dip.rule;
  if (!r) return "";
  return `<section class="card"><div class="note" style="padding-top:12px;font-size:14px;color:var(--text)">
    <b>Buy</b>: when a stock appears on a scanner, place a buy-stop at its <b>trigger</b> (the signal day's high; the week's high for Weekly)
    for ${r.entry_days} days (${r.entry_days_weekly} for Weekly).<br><br>
    <b>Sell</b>: at the next open after a close below the ${r.exit_ma}-day average, or at the ${r.stop}% stop (${Object.values(r.stop_by || {})[0] || r.stop}% for Weekly), or after a year.<br><br>
    <b>Slots</b>: 15 positions of about 6.7% each. If short of slots, take 1st choice (mid caps) first.<br><br>
    <b>Fundamentals</b> (information only): the <b>F</b> tag is the Valuepick score (0–100) of each scanner stock, from Yahoo Finance data refreshed monthly (or your Screener export if loaded):
    green = Shortlist, red = Skip/Reject, grey = Maybe or check flags. It never changes a buy or sell.<br><br>
    <b>Filters</b>: Weekly only takes calm stocks (daily range under ${Object.values(r.atr_max || {})[0] || 4}%); 63/30 only within ${Object.values(r.near_high || {})[0] || 10}% of the 52-week high.</div></section>`;
}

function renderMore(d) {
  const tabs = { rule: "How it works", backtest: "Backtest", now: "On scanners", breakouts: "Breakouts", sectors: "Sectors" };
  const chips = `<div class="sub2 filters">${Object.entries(tabs).map(([k, v]) => `<button data-more="${k}" class="${state.more === k ? "on" : ""}">${v}</button>`).join("")}</div>`;
  const body = { rule: renderRule, backtest: (x) => renderPerformance(x.performance) || `<div class="empty">No backtest yet.</div>`,
                 now: renderNow, breakouts: renderBreakouts, sectors: renderSectors }[state.more](d);
  return chips + body;
}

function render() {
  const d = state.data;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
  $("#view").innerHTML = { today: renderToday, more: renderMore }[state.tab](d);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) state.tab = t.dataset.tab;
  else if (t.dataset.scanner) state.scanner = t.dataset.scanner;
  else if (t.dataset.status) state.status = t.dataset.status;
  else if (t.dataset.more) state.more = t.dataset.more;
  else return;
  render();
});

fetch("data.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((d) => {
    state.data = d;
    $("#updated").textContent = `Updated ${fmtWhen(d.last_scan)}`;
    render();
  })
  .catch((e) => { $("#view").innerHTML = `<div class="err">Couldn't load the data (${esc(e.message)}). Pull down to refresh.</div>`; });
</script>
</body>
</html>
