name: Chartink backtest model training

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chartink-scan
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-train.txt

      - name: Fetch historical prices and compute outcomes
        working-directory: scripts
        run: python fetch_price_outcomes.py

      - name: Build report and send Telegram summary
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: scripts
        run: python train_report.py

      - name: Commit updated database and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chartink.db reports/model_report.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update backtest outcomes and model report $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
