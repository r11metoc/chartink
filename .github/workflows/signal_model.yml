name: Weekly retrain (backtest + ML ranker)

# Every Saturday (or Run workflow, also started by the app after a backtest
# upload): fetch fresh prices for every scanner hit (Chartink backtest exports
# + live triggers), re-run the live rule over them, retrain the ML ranker with
# its walk-forward test (scripts/ranker.py) and rebuild the backtest
# (data/model/performance.json, data/model/ranker.json, reports/).

on:
  schedule:
    - cron: "17 3 * * 6"  # Saturday 08:47 IST, after the week's trades
  push:
    branches-ignore: []
    paths:
      - "scripts/**"
      - "site/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "train (kept for the app's Upload page)"
        type: choice
        options: [train]
        default: train

permissions:
  contents: write
  actions: write

concurrency:
  group: signal-model
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-train.txt pytest

      - name: Offline tests
        run: python -m pytest tests/ -q

      - name: Backtest and ML ranker (fetches prices)
        working-directory: scripts
        run: python stock_outcomes.py

      - name: Commit backtest, model and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model/performance.json data/model/ranker.json reports/stock_outcomes.md reports/ml_ranker.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly retrain $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Trigger scan and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run scan.yml --ref "${{ github.ref_name }}"
