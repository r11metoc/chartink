name: Chartink breakout scan

on:
  schedule:
    # Mon-Fri 09:23, 12:23, 15:23 IST (03:53, 06:53, 09:53 UTC). Kept off the top
    # of the hour, when GitHub's scheduler is busiest and delays runs the most.
    - cron: "53 3 * * 1-5"
    - cron: "53 6 * * 1-5"
    - cron: "53 9 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Dump page HTML/screenshot as an artifact"
        type: boolean
        default: false
      snap:
        description: "Send current scan results + buy/hold list to Telegram (always on for scheduled runs; this only matters for manual runs)"
        type: boolean
        default: false
      digest:
        description: "Send a digest of recent breakouts to Telegram (always on for scheduled runs; this only matters for manual runs)"
        type: boolean
        default: false
      days:
        description: "Lookback window in days for the digest"
        type: string
        default: "30"

permissions:
  contents: write

concurrency:
  group: chartink-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHARTINK_DEBUG_DUMP: ${{ inputs.debug && '1' || '0' }}
          CHARTINK_SEND_SNAPSHOT: ${{ (github.event_name == 'schedule' || inputs.snap) && '1' || '0' }}
          CHARTINK_SEND_DIGEST: ${{ (github.event_name == 'schedule' || inputs.digest) && '1' || '0' }}
          CHARTINK_DIGEST_DAYS: ${{ inputs.days || '30' }}
        working-directory: scripts
        run: python run.py

      - name: Upload debug artifact
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: chartink-debug-dump
          path: debug/
          retention-days: 7

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chartink.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update scan data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
