name: Chartink breakout scan

on:
  schedule:
    # GitHub starts scheduled runs hours late, so this fires every 15 minutes and
    # scripts/slot_gate.py decides by the actual time: one scan per slot at
    # 09:23, 12:23 and 15:23 IST, Mon-Fri. Every other run stops in seconds.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Dump page HTML/screenshot as an artifact"
        type: boolean
        default: false
      snap:
        description: "Send current scan results + buy/hold list to Telegram (always on for scheduled runs; this only matters for manual runs)"
        type: boolean
        default: false
      digest:
        description: "Send a digest of recent breakouts to Telegram (always on for scheduled runs; this only matters for manual runs)"
        type: boolean
        default: false
      days:
        description: "Lookback window in days for the digest"
        type: string
        default: "30"

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.gate.outputs.slot }}
    steps:
      - if: github.event_name == 'schedule'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            scripts
            data

      - id: gate
        if: github.event_name == 'schedule'
        working-directory: scripts
        run: python3 slot_gate.py

  scan:
    needs: gate
    if: github.event_name != 'schedule' || needs.gate.outputs.slot != ''
    # On the job, not the workflow, so the frequent gate runs never queue
    # behind (or cancel) a real scan.
    concurrency:
      group: chartink-scan
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A normal run takes ~1 min. Without a limit, a hung apt/browser download
    # holds the concurrency group (and every queued scan) for GitHub's 6h default.
    timeout-minutes: 15
    steps:
      # Branch head, not the triggering commit: a run queued behind another
      # must start from the database that run just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHARTINK_DEBUG_DUMP: ${{ inputs.debug && '1' || '0' }}
          CHARTINK_SEND_SNAPSHOT: ${{ (github.event_name == 'schedule' || inputs.snap) && '1' || '0' }}
          CHARTINK_SEND_DIGEST: ${{ (github.event_name == 'schedule' || inputs.digest) && '1' || '0' }}
          CHARTINK_DIGEST_DAYS: ${{ inputs.days || '30' }}
          CHARTINK_SLOT: ${{ needs.gate.outputs.slot }}
        working-directory: scripts
        run: python run.py

      - name: Upload debug artifact
        if: ${{ inputs.debug }}
        uses: actions/upload-artifact@v4
        with:
          name: chartink-debug-dump
          path: debug/
          retention-days: 7

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chartink.db
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Update scan data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
